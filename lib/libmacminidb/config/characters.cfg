# characters.cfg — static character catalogue for MacMiniDB.
#
# Roster + abilities are from Tetris Battle Gaiden (Bullet Proof Software, 1993).
# Each character offers 4 progressively-unlocked ability LEVELS; the catalogue
# records only which levels exist as a bitfield (bit i set => level i+1 offered).
# Every character offers all four, so abilities is 0xF across the board. The
# effect of each (character_id, level) is the game engine's business, not the
# DB's — the names below are documentation only.
#
# Format: one record per line, fields '|'-separated, blank lines and lines
# starting with '#' ignored:
#     id | name | abilities(hex bitfield) | cost_points
#
# id 1 is the free starter (cost 0); costs climb with the roster.
#
# 1 Halloween       L1 Fry       L2 Dark      L3 Vampire   L4 Bomb
1|Halloween|0xF|0
# 2 Mirurun         L1 Mirurun   L2 Inversion L3 Pentaris  L4 Sirtet
2|Mirurun|0xF|500
# 3 Shaman          L1 Moses     L2 Rotation  L3 Curse     L4 Prayer
3|Shaman|0xF|800
# 4 Aladdin         L1 Seesaw    L2 Shield    L3 Fax       L4 Remote
4|Aladdin|0xF|1000
# 5 Princess        L1 Sol       L2 Mirror    L3 Paralysis L4 Copy
5|Princess|0xF|1200
# 6 Bit             L1 Stardust  L2 Fever     L3 Gang      L4 Mambo
6|Bit|0xF|1500
# 7 Ninja           L1 Assemble  L2 Fraud     L3 Ruin      L4 Medusa
7|Ninja|0xF|1800
# 8 Wolf-man        L1 Cut       L2 Nue       L3 Pals      L4 Thwack
8|Wolf-man|0xF|2200
# 9 Dragon          L1 Press     L2 Wish      L3 Roulette  L4 Change
9|Dragon|0xF|2800
# 10 Grand Princess L1 Hyper Fry L2 Reverse   L3 Double    L4 Clear
10|Grand Princess|0xF|3500
