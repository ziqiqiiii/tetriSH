# themes.cfg — static board-theme catalogue for MacMiniDB.
#
# Cosmetic only: a theme restyles the board/pieces, no gameplay effect. This
# roster is invented for tetriSH (not from any source game).
#
# Format: one record per line, fields '|'-separated, blank lines and lines
# starting with '#' ignored:
#     id | name | description
#
# name <= 31 chars, description <= 127 chars. id 1 is the free default.
#
1|Classic|The original flat palette — the look every player starts with.
2|Midnight|Deep navy field with neon-edged pieces that glow as they fall.
3|Sakura|Soft pink board scattered with drifting cherry blossom petals.
4|Vaporwave|Sunset gradients, chrome grids, and a hum of retro synth haze.
5|Forest|Mossy greens and bark browns; pieces settle like falling leaves.
6|Lava|Charcoal field cracked with molten orange seams under the stack.
7|Glacier|Frosted blues and white; cleared lines shatter like thin ice.
8|Monochrome|Stark black-and-white minimalism for the purists who hate noise.
9|Galaxy|A starfield backdrop where pieces trail faint cosmic stardust.
10|Arcade|Loud CRT scanlines and candy-bright blocks straight from 1989.
