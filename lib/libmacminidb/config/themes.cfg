# themes.cfg — static board-theme catalogue for MacMiniDB.
#
# Cosmetic only: a theme restyles the board and renames each character (a
# per-theme nickname), with no gameplay effect — actual names and abilities are
# unchanged. Roster and pricing are from docs/themes.md and
# docs/game-economics.md.
#
# Format: one record per line, fields '|'-separated, blank lines and lines
# starting with '#' ignored:
#     id | name | cost_points | description
#
# name <= 31 chars, description <= 127 chars. id 1 is the free default theme;
# "Design and AI" is free for SUTDents. Costs are flat wallet_points.
#
1|Default|0|The canonical Tetris Battle Gaiden look; the theme every player starts with.
2|Design and AI|0|SUTD red, white, and black — free for SUTDents; AI as a mindset, not a tool.
3|Do u wanna build a snowman?|25|Frozen-inspired reskin; the roster becomes Elsa, Sven, Olaf, and Anna.
4|Haaland|20|Man City / Norway tribute; nicknames from Princess Haaland to Viking Haaland.
5|John Cena|30|You can't see me — the roster suits up as Cena, blushing 👉👈 optional.
6|Claude-ing|25|Claude orange on dark; the family of AIs from Gemini to Brother Claude.
7|Al-Merqaedes|35|Mercedes F1 send-up; Toto Wolff-man leads Antonelli and friends.
8|Nuclear Gandhi|35|Civ-style reskin; a cute-but-nuclear Gandhi roster from Princess to Mirurun.
